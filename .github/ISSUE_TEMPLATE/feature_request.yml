name: Feature request
description: Suggest something new or different.
labels: ["enhancement"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Which half?
      options:
        - Plugin (Tabby tab indicators / TTS / hooks)
        - Webapp (snapshot/restore, MCP explorer)
        - Both / unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's the situation today and why is it limiting?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the plugin or webapp do instead?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why they don't fit.

  - type: checkboxes
    id: checked
    attributes:
      label: Pre-flight
      options:
        - label: I've checked that this isn't already requested or already in upstream `tabby-claude-status-gse`
          required: false
