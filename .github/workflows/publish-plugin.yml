name: Publish plugin to npm

# Triggered when a `v*` tag is pushed (e.g. `v1.2.1`). The version in
# plugin/package.json must match the tag. The webapp doesn't publish to npm,
# so a single `v*` tag train is unambiguous.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # for action-gh-release to create the GitHub Release on tag push
  id-token: write   # for npm Trusted Publishing (OIDC) + provenance attestations

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships with npm >= 11, which is required for Trusted Publishing
      # (the OIDC handshake that lets `npm publish` authenticate without a
      # long-lived NPM_TOKEN secret). Node 22 still ships with npm 10 and would
      # reject the OIDC flow.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (-> $tag_version) does not match plugin/package.json version ($pkg_version)"
            exit 1
          fi
          echo "Tag and package.json agree on $pkg_version."

      - name: Install dependencies (uses .npmrc legacy-peer-deps)
        run: npm ci

      - name: Install root tooling (Biome)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Lint + format check (Biome)
        working-directory: ${{ github.workspace }}
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Trusted Publishing: npm CLI 11+ exchanges the workflow's GitHub OIDC
      # token (granted by `id-token: write` above) for a short-lived publish
      # credential. No NPM_TOKEN secret needed — npm verifies the publish came
      # from this exact (owner, repo, workflow) tuple as configured at
      # https://www.npmjs.com/package/tabby-claude-status/access.
      - name: Publish to npm (Trusted Publishing + provenance)
        run: npm publish --access public --provenance

      # Surface the release on the GitHub repo's home page (Releases sidebar)
      # with auto-generated notes from PRs/commits since the previous tag.
      # Runs after npm publish so a failed npm push doesn't leave behind a
      # GitHub Release pointing at nothing.
      - name: Create GitHub Release
        working-directory: ${{ github.workspace }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
