name: Publish plugin to npm

# Triggered when a `plugin-v*` tag is pushed (e.g. `plugin-v1.2.1`). The
# version in plugin/package.json must match the tag. Use a separate tag prefix
# from the webapp so the two halves of this monorepo can release on their own
# cadence.
on:
  push:
    tags:
      - "plugin-v*"

permissions:
  contents: read
  id-token: write   # for npm provenance attestations

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#plugin-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (-> $tag_version) does not match plugin/package.json version ($pkg_version)"
            exit 1
          fi
          echo "Tag and package.json agree on $pkg_version."

      - name: Install dependencies (uses .npmrc legacy-peer-deps)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
